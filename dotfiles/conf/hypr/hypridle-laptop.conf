# hypridle — laptop profile.
# install.sh installs this as ~/.config/hypr/hypridle.conf on machine=laptop.
#
# On mains power: NOTHING happens. No dim, no lock, no blank, no suspend.
# On battery: dim, then lock, then blank, then suspend.
#
# Every timeout action is wrapped in scripts/idle-guard.sh, which exits 0
# without acting when a Mains supply reports online. hypridle has no built-in
# on-AC condition, so the check lives in the action.
#
# Backlight is handled by scripts/idle-dim.sh rather than `brightnessctl -s/-r`
# — see the comment in that script for why the -s/-r pair is unsafe.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Dim the backlight at 2.5 min (battery only). Restores on any activity,
# including after an unlock, and restores even if you plugged in meanwhile.
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh dim
    on-resume = ~/.config/hypr/scripts/idle-dim.sh restore
}

# Keyboard backlight off at 2.5 min (battery only). Harmless if absent.
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# Lock at 5 min (battery only).
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh loginctl lock-session
}

# Display off at 5.5 min (battery only). Always turns back on, so a stale
# blank can never outlive the idle period.
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend at 30 min (battery only).
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh systemctl suspend
}
