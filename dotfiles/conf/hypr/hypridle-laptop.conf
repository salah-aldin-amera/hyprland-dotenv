# hypridle — laptop profile.
# install.sh installs this as ~/.config/hypr/hypridle.conf on machine=laptop.
#
# Tighter than the desktop profile, and it actually suspends to save battery.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Dim the backlight at 2.5 min, restore on activity.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Keyboard backlight off at 2.5 min. Harmless if the machine has none.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# Lock at 5 min.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Display off at 5.5 min.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend at 30 min.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
