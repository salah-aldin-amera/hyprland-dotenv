# hyprqt6engine — Qt6 theming for Hyprland.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprqt6engine/
#
# Replaces both qt6ct and plasma-integration. Activated by
# QT_QPA_PLATFORMTHEME=hyprqt6engine, exported from hyprland.lua.
#
# Why this instead of plasma-integration: that package needs
# xdg-desktop-portal-kde, which needs plasma-workspace, which needs kwin —
# about 35 packages and a full Plasma session entry in
# /usr/share/wayland-sessions/, which is how a machine ends up booting into
# Plasma by accident. hyprqt6engine needs hyprlang, hyprutils, qt6-base,
# kconfig, kcolorscheme and kiconthemes.
#
# breeze is still installed, but only for the widget style and the BreezeDark
# colour scheme below — it depends on KDE frameworks, not on Plasma.

theme {
    # KColorScheme-format file, so KDE apps and Qt apps agree on colours.
    # Matches ColorScheme=BreezeDark in ~/.config/kdeglobals.
    color_scheme = /usr/share/color-schemes/BreezeDark.colors

    # Widget style. Breeze comes from the breeze package. Fusion is the Qt
    # built-in fallback and also honours color_scheme, so it stays dark if
    # breeze is ever removed. kvantum-dark works too, if kvantum is set up.
    style = Breeze

    # Same theme as waybar's taskbar and hyprtoolkit — see hyprtoolkit.conf.
    icon_theme = Adwaita

    font      = Noto Sans
    font_size = 11

    font_fixed      = FiraCode Nerd Font
    font_fixed_size = 11
}
