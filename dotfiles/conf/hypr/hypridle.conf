# hypridle — desktop (pc) profile.
# install.sh installs this as ~/.config/hypr/hypridle.conf on machine=pc.
#
# Deliberately NO listeners: the desktop never locks or blanks on its own.
# Lock on demand with SUPER+L.
#
# The general block still matters — it makes a lock triggered by anything else
# (loginctl lock-session, a suspend from the menu) behave correctly.
#
# If you later want idle blanking, add:
#
#   listener {
#       timeout = 900                              # 15 min
#       on-timeout = hyprctl dispatch dpms off
#       on-resume = hyprctl dispatch dpms on
#   }
#
# See hypridle-laptop.conf for the battery-aware version.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}
