# hyprlauncher — launcher / picker, replaces rofi + wofi.
# https://github.com/hyprwm/hyprlauncher
#
# Started as a daemon from hyprland.lua autostart (`hyprlauncher -d`) so
# SUPER+SPACE toggles an already-warm process.
#
# Appearance comes from the hyprtoolkit theme, not from here.

general {
    # Take keyboard focus when the window opens.
    grab_focus = true

    # Start with an empty list; type to search. Set to true to list every
    # desktop entry the moment it opens.
    show_apps_on_open = false
}

cache {
    # Rank frequently launched entries higher.
    enabled = true
}

finders {
    # What a bare query searches.
    default_finder = desktop

    # Type one of these prefixes to switch finder mid-query:
    #   (none)  applications
    #   .       unicode / emoji   (copies to clipboard, needs wl-copy)
    #   =       math via libqalculate, e.g. "=  17 * 3 + 2"
    #   '       fonts             (copies the family name)
    desktop_prefix = ""
    unicode_prefix = "."
    math_prefix    = "="
    font_prefix    = "'"

    # Terminal used for desktop entries marked Terminal=true.
    desktop_terminal = kitty

    desktop_icons = true
}

ui {
    window_size = 600, 400
}
