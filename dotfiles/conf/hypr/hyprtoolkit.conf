# hyprtoolkit — the toolkit hyprlauncher and other hypr* GUIs draw with.
# Lives at ~/.config/hypr/hyprtoolkit.conf (hyprutils findConfig).
#
# Keys are flat, no sections.
#
# icon_theme was previously unset. Empty means "resolve via
# /usr/share/icons/default/index.theme", which currently inherits Adwaita —
# that is what hyprlauncher has been rendering. Pinning it explicitly so a
# package update to that file cannot silently change the look, and so waybar's
# wlr/taskbar (which names its theme directly) stays in agreement.
#
# Keep this in sync with "icon-theme" in dotfiles/conf/waybar/modules.jsonc.
icon_theme = Adwaita

# Colours — the defaults, written out so they are visible and tweakable.
# Format is 0xAARRGGBB.
background      = 0xFF181818
base            = 0xFF202020
alternate_base  = 0xFF272727
text            = 0xFFDADADA
bright_text     = 0xFFFFDEDE
link_text       = 0xFF4EECF8
accent          = 0xFF00FFCC
accent_secondary = 0xFF0099F0

rounding_large = 10
rounding_small = 5

# Match the terminal/bar font rather than the "Sans Serif" default.
font_family           = Noto Sans
font_family_monospace = FiraCode Nerd Font

h1_size         = 19
h2_size         = 15
h3_size         = 13
font_size       = 11
small_font_size = 10
