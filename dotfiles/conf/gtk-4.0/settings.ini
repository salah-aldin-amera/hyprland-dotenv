# GTK4 dark theme.
#
# GTK4/libadwaita apps mostly follow the gsettings color-scheme key rather than
# a theme name, which install.sh sets to prefer-dark. This file covers GTK4 apps
# that still read settings.ini, and keeps fonts and cursors consistent with
# gtk-3.0/settings.ini.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
