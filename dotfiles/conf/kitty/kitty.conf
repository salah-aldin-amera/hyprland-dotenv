background_opacity 0.75

# Allow OSC52 clipboard access from remote machines (SSH)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Enable remote control so session scripts can query window/tab state
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Ctrl+Shift+S  →  kitty native input bar
# Ctrl+Shift+R  →  loads session via goto_session
# Ctrl+Shift+F  →  fzf tab switcher (floating overlay)
map ctrl+shift+s save_as_session --save-only --use-foreground-process --base-dir ~/.config/kitty/sessions/
map ctrl+shift+r goto_session ~/.config/kitty/sessions/
map ctrl+shift+f launch --type=overlay --title=tab-switcher --stdin-source=none bash ~/.config/kitty/scripts/tab_switcher.sh
