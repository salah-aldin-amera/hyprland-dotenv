# GTK3 dark theme.
#
# On salahaldin-pc this was only ever set in dconf (gsettings), with no file on
# disk — so a new machine came up light and nothing in the repo explained why.
# Tracked here AND applied via gsettings by install.sh, because the two are
# read by different things: GTK reads this file, while portals, libadwaita and
# GNOME apps read the gsettings keys.
#
# Adwaita-dark is built into GTK3 — gnome-themes-extra is NOT required (neither
# machine has it).
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24

# The one that actually matters for apps that ship their own light default.
gtk-application-prefer-dark-theme=1

gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
